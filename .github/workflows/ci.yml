name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run lint (ruff)
        run: uv run ruff check .
      - name: Run types (pyright)
        run: uv run pyright
      - name: Run unit tests
        run: uv run pytest -q -m "not live and not slow"
      - name: Run JavaScript tests
        run: node --test tests/js/*.test.mjs
