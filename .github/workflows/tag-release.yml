name: Tag release

# Turns a tag YOU push by hand (matching v*) into a GitHub Release with auto-generated notes. The automatic patch
# bump (release.yml) creates its own release directly instead of relying on this: a tag it pushes with the default
# GITHUB_TOKEN does not trigger this workflow (GitHub blocks a GITHUB_TOKEN-authored push from starting another
# workflow run, to stop recursive runs). This workflow only fires for a tag pushed with your own credentials.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists, nothing to do"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi
