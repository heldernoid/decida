name: Tag release

# Turns any pushed tag matching v* into a GitHub Release with auto-generated notes. This is the one place that
# creates releases: the automatic patch bump (release.yml) pushes a tag and lands here, and a tag pushed by hand
# (for the first release, or a minor/major one) lands here the same way.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists, nothing to do"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi
